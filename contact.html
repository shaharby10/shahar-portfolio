<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Shahar Ben Yaacov</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="styles.css?v=54a">
  <script src="nav.js"></script>
  <script src="contact.js" defer></script>
  <script src="menu.js" defer></script>
</head>
<!-- The Contact page (Figma "contact page desktop").
     "home-page" gives it the same sizes and navigation as the home page;
     "layout-b" puts Index, About and Contact at the top right. -->
<body class="home-page contact-page layout-b">

  <!-- Name and navigation, fixed to the window. The name leads back to the home page. -->
  <header class="home-header">
    <!-- On a phone the small name says "Home" instead -->
    <a class="home-name" href="index.html"><span class="name-full">Shahar Ben Yaacov</span><span class="name-home">Home</span></a>
    <nav class="home-nav">
      <a class="nav-item nav-index" href="project-index.html">Index</a>
      <a class="nav-item nav-about" href="about.html">About</a>
      <a class="nav-item nav-contact" href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <!-- Phone only: the asterisk opens a menu with the navigation (menu.js) -->
  <button class="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="phone-menu">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <path id="star-arm" d="M50 50 C47.6 41 42.2 25 42.6 16.5 A7.6 7.6 0 1 1 57.4 16.5 C57.8 25 52.4 41 50 50 Z"/>
      </defs>
      <use href="#star-arm"/>
      <use href="#star-arm" transform="rotate(60 50 50)"/>
      <use href="#star-arm" transform="rotate(120 50 50)"/>
      <use href="#star-arm" transform="rotate(180 50 50)"/>
      <use href="#star-arm" transform="rotate(240 50 50)"/>
      <use href="#star-arm" transform="rotate(300 50 50)"/>
    </svg>
  </button>
  <nav class="phone-menu" id="phone-menu" hidden>
    <a class="menu-link" href="project-index.html">Index</a>
    <a class="menu-link" href="about.html">About</a>
    <a class="menu-link" href="contact.html">Contact</a>
  </nav>

  <!-- The page fills the screen; the text sits at its bottom, as in Figma.
       Everything is placed by its Figma numbers in style=""
       (--left, --top, --width in Figma pixels of the 1440 x 848 frame). -->
  <main class="contact">
    <div class="contact-stage">
      <h1 class="contact-question project-placed" style="--left: 40; --top: 307; --width: 1135">Have a project in mind<span class="contact-red">?</span></h1>
      <p class="contact-talk project-placed" style="--left: 34; --top: 445; --width: 1074">Let<span class="contact-red">'</span>s talk.</p>
      <!-- A click on a line (the word or "(copy)") copies the address, without opening it (contact.js) -->
      <ul class="contact-lines project-placed" style="--left: 1067; --top: 518; --width: 338">
        <li><button class="about-copy" type="button" data-copy="shaharby10@gmail.com" aria-label="Copy email address">Email <span class="about-copy-bracket">(</span><span class="about-copy-word">copy</span><span class="about-copy-bracket">)</span></button></li>
        <li><button class="about-copy" type="button" data-copy="https://www.instagram.com/by_shahar_/?__d=1%252F%253Fhidemenu%253Dtrue" aria-label="Copy Instagram link">Instagram <span class="about-copy-bracket">(</span><span class="about-copy-word">copy</span><span class="about-copy-bracket">)</span></button></li>
        <li><button class="about-copy" type="button" data-copy="www.linkedin.com/in/shaharbenyaacov" aria-label="Copy LinkedIn link">LinkedIn <span class="about-copy-bracket">(</span><span class="about-copy-word">copy</span><span class="about-copy-bracket">)</span></button></li>
      </ul>
    </div>
  </main>
</body>
</html>
