<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shahar Ben Yaacov – Portfolio 2026</title>
  <!-- Garamond Premier Pro from Adobe Fonts (Web Project) -->
  <link rel="stylesheet" href="https://use.typekit.net/img6kxj.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <!-- The "stage" fills the whole window with the background color -->
    <div class="stage">

      <!-- The "composition" is the 1440×900 Figma frame, scaled to fit and centered.
           Everything inside is placed with the same x/y as in Figma. -->
      <div class="composition">

        <!-- Project images: hidden and blurred, they fade in on hover.
             The order here matches the layer order in Figma (later = on top). -->
        <div class="project project--kolnoa-darom">
          <div class="project-image">
            <img src="images/kolnoa-darom.jpg" alt="">
          </div>
        </div>

        <div class="project project--birkat-shalom">
          <div class="project-image">
            <img src="images/birkat-shalom.jpg" alt="">
          </div>
        </div>

        <div class="project project--exhibition-design">
          <div class="project-image">
            <img src="images/exhibition-design.jpg" alt="">
          </div>
        </div>

        <div class="project project--shoponi">
          <div class="project-image">
            <img src="images/shoponi.jpg" alt="">
          </div>
        </div>

        <div class="project project--travel-journal-scribble">
          <div class="project-image">
            <img src="images/travel-journal-scribble.jpg" alt="">
          </div>
        </div>

        <!-- Small details: name, phone, email, title -->
        <p class="detail detail--name">Shahar Ben Yaacov</p>
        <p class="detail detail--phone"><a href="tel:+972528882640">+972528882640</a></p>
        <p class="detail detail--email"><a href="mailto:shaharby10@gmail.com">shaharby10@gmail.com</a></p>
        <p class="detail detail--portfolio">Portfolio 2026</p>

        <!-- Main headline -->
        <h1 class="headline">
          <span class="headline-coming">coming</span>
          <span class="headline-soon">soon<span class="headline-period">.</span></span>
        </h1>

        <p class="tagline">Still deciding how to say it.</p>

        <!-- This project sits on top of all the text in Figma, so it comes last -->
        <div class="project project--travel-journal-cyanotype">
          <div class="project-image">
            <img src="images/travel-journal-cyanotype.jpg" alt="">
          </div>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
